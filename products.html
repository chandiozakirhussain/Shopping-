<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shop | VoltCart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="header"></div>
<main class="container">
  <h1 class="page-title">All Products</h1>
  <div class="toolbar">
    <input id="search" type="search" placeholder="🔍 Search earbuds, power bank, charger..." aria-label="Search products">
    <select id="sort" aria-label="Sort products">
      <option value="">Sort: Featured</option>
      <option value="low">Price: Low to High</option>
      <option value="high">Price: High to Low</option>
      <option value="rating">Top Rated</option>
    </select>
    <div class="chips" id="chips"></div>
  </div>
  <p id="count" style="color:var(--muted);margin-bottom:14px"></p>
  <div class="grid" id="grid"></div>
</main>
<div id="footer"></div>
<script src="app.js"></script>
<script>initShop();</script>
</body>
</html>
